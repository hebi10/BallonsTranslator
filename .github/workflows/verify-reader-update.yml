name: Verify local reader and image export

on:
  push:
    branches: ['codex/local-reader-export']
    paths: ['.github/workflows/verify-reader-update.yml']

permissions:
  contents: read

jobs:
  reader-ui:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        qt: [pyqt5, pyqt6]
    env:
      QT_QPA_PLATFORM: offscreen
      QT_API: ${{ matrix.qt }}
      PYTHONUTF8: '1'
      OLLAMA_NO_CLOUD: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      READER_SCREENSHOT_DIR: reader-verification
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install existing test dependencies
        run: python -m pip install -r requirements.txt pytest "openai>=2.8.1" "PyQt5==5.15.11"
      - name: Prepare Korean font for offscreen verification only
        shell: powershell
        run: |
          $FontPath = Join-Path $env:RUNNER_TEMP 'NotoSansCJKkr-Regular.otf'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/Korean/NotoSansCJKkr-Regular.otf' -OutFile $FontPath
          "READER_TEST_FONT=$FontPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify actual Korean layout and cleanup
        run: python -m pytest tests/test_result_reader_ui.py::test_ui_screenshots_and_small_window -x -vv -s --tb=long --junitxml=reader-verification/layout.xml
      - name: Verify reader export and full UI suite
        run: python -m pytest tests/test_reader_export.py tests/test_result_reader_ui.py -x -vv --tb=long --junitxml=reader-verification/tests.xml
      - name: Upload images and test results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-verification-${{ matrix.qt }}
          path: reader-verification/
          if-no-files-found: warn
          retention-days: 14
